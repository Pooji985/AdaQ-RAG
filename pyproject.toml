[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaq-rag"
version = "0.1.0"
description = "Intent-Aware Adaptive Retrieval for Efficient Augmented Generation"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
